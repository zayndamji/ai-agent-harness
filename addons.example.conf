# Add-ons: tools built into the container on top of what the harness needs.
# Copy to addons.conf and edit; addons.conf stays out of git, like .env.
# Changes take effect on the next ./start.sh, which rebuilds the image.
#
# One installer per line, then package names separated by spaces. A line can
# repeat. Everything after # is a comment.
#   apt: Debian packages (https://packages.debian.org, the "trixie" release)
#   npm: Node command-line tools, installed globally
#   pip: Python packages, importable by every session (adds Python by itself)
#
# Built in without being listed: Node and npm, Claude Code, git, ripgrep, tar.

# Common development tools. vim-tiny is the vi that EDITOR points at.
apt: bash-completion build-essential curl jq less openssh-client procps unzip vim-tiny
apt: python3 python3-venv

# For example:
# apt: fonts-noto-cjk          # Chinese, Japanese and Korean text in the Browser tab's Chrome
# npm: typescript
# pip: requests
