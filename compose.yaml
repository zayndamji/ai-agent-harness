name: claude-harness

# Shared by both services: same image, same volumes, same restrictions.
x-claude: &claude
  build: .
  image: claude-harness:latest
  hostname: claude-box
  init: true
  volumes:
    # Login, settings and session history (~/.claude and ~/.claude.json).
    - home:/home/node
    # Projects Claude works on: the folder HARNESS_WORKSPACE names, or the
    # `workspace` volume when it's empty. Nothing else from the host is mounted.
    - ${HARNESS_WORKSPACE:-workspace}:/workspace
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  # Claude Code in your terminal: docker compose run --rm claude
  claude:
    <<: *claude
    stdin_open: true
    tty: true

  # The web UI: docker compose up -d web
  web:
    <<: *claude
    command: ["node", "/opt/harness/server.js"]
    environment:
      HARNESS_PASSWORD: ${HARNESS_PASSWORD:-}
      HARNESS_CLAUDE_ARGS: ${HARNESS_CLAUDE_ARGS:-}
      HARNESS_MAX_SESSIONS: ${HARNESS_MAX_SESSIONS:-10}
    ports:
      - "${HARNESS_BIND:-127.0.0.1}:${HARNESS_PORT:-28471}:8080"
    restart: unless-stopped

volumes:
  home:
  workspace:
